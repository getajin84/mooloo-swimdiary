name: 수영일기 매일 게시

on:
  schedule:
    - cron: "0 23 * * *"    # 매일 08:00 KST 게시 시작
    - cron: "13 0 * * *"    # 예비 09:13 KST — GitHub 예약이 늦거나 빠질 때 대비 (이미 올렸으면 아무것도 안 함)
    - cron: "43 1 * * *"    # 예비 10:43 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1이면 실제 게시 없이 확인만"
        default: "0"

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 다음 줄(3편) 게시
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          ASSET_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/content/queue
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python publish/publish.py
      - name: 게시 기록 저장
        if: always()
        run: |
          git config user.name "swimdiary-bot"
          git config user.email "swimdiary-bot@users.noreply.github.com"
          git add content/state.json
          git diff --cached --quiet || git commit -m "chore: 게시 기록 업데이트"
          git push
